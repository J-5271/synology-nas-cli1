name: CI

on:
  pull_request:
  push:
    branches: [main]
    # 推 v* 标签即触发发布（版本号取标签名）
    tags: ["v*"]
  # 也可手动审批发布：Actions 页面 → Run workflow → 填版本号（如 v1.0.0）
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号（语义化版本，如 v1.0.0）"
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NAS_HOST: 10.0.0.1
      NAS_USER: root
      NAS_PORT: "22"
    steps:
      # 第三方 Actions 固定到 commit SHA（防标签被劫持）；升级时人工核对后再改 SHA
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: 语法检查
        run: python -m py_compile scripts/*.py

      - name: 守卫-只读命令应放行
        run: |
          python scripts/nas_exec.py --dry-run "cat /etc/VERSION; df -h"
          python scripts/nas_exec.py --dry-run "/usr/syno/sbin/synouser --help"

      # 守卫只在「非 dry-run」时生效：不加 --yes 必须返回 2，且不连设备
      - name: 守卫-改配置应拦截
        run: |
          set +e
          python scripts/nas_exec.py "/usr/syno/sbin/synouser --setpw <账号> <密码>"
          rc1=$?
          python scripts/nas_exec.py "/usr/syno/sbin/synonet --manual eth0 1.2.3.4 255.255.255.0"
          rc2=$?
          python scripts/nas_exec.py "/usr/syno/sbin/synoshare --setuser private RW + alice"
          rc3=$?
          set -e
          echo "exit codes: setpw=$rc1 synonet=$rc2 synoshare=$rc3"
          [ "$rc1" -ne 0 ] && [ "$rc2" -ne 0 ] && [ "$rc3" -ne 0 ]

      - name: 凭据扫描（命中真实凭据即失败 exit 4）
        run: python scripts/pack_skill.py --mode full --no-state

  # 仅 workflow_dispatch 触发：打包 + SHA256 校验和 + 发布 Release
  release:
    # 两种触发：手动 Run workflow，或推 v* 标签
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 解析版本号
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          tar czf "synology-nas-cli-$VERSION.tar.gz" \
            --exclude='.git*' --exclude='build' --exclude='__pycache__' \
            --exclude='.update_state.json' .
          sha256sum "synology-nas-cli-$VERSION.tar.gz" > "synology-nas-cli-$VERSION.sha256"
          cat "synology-nas-cli-$VERSION.sha256"

      - name: 发布 Release（含校验和）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            "synology-nas-cli-$VERSION.tar.gz" \
            "synology-nas-cli-$VERSION.sha256" \
            --title "$VERSION" \
            --notes "自动构建产物。安装：下载 tar.gz 后解压到 ~/.workbuddy/skills/synology-nas-cli/"
